<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubPooL Icon Variants</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1a2138;}
  .wrap{display:grid;grid-template-columns:repeat(3,220px);gap:28px;}
  .card{background:#fff;border:1px solid #e4e9f2;border-radius:20px;padding:24px;text-align:center;box-shadow:0 12px 32px rgba(46,58,84,.08);}
  .icon{width:128px;height:128px;margin:0 auto 16px;display:block;}
  h2{margin:0 0 6px;font-size:17px;}
  p{margin:0;color:#6b768d;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <svg class="icon" viewBox="0 0 64 64" role="img" aria-label="方案 A">
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#5B6BE8"/>
      <path d="M20 18v28M44 18v28M21 32h22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="20" cy="18" r="4.5" fill="#F7B955"/>
      <circle cx="44" cy="46" r="4.5" fill="#35D08A"/>
    </svg>
    <h2>A · Hub H</h2>
    <p>最简品牌字母，两个节点表达协作流转。</p>
  </section>
  <section class="card">
    <svg class="icon" viewBox="0 0 64 64" role="img" aria-label="方案 B">
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#1F2A44"/>
      <path d="M20 23h24M20 32h24M20 41h24" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="20" cy="23" r="4.2" fill="#5B6BE8"/>
      <circle cx="44" cy="32" r="4.2" fill="#38BDF8"/>
      <circle cx="20" cy="41" r="4.2" fill="#F7B955"/>
    </svg>
    <h2>B · Requirement Pool</h2>
    <p>需求池/列表感更强，适合工具型产品。</p>
  </section>
  <section class="card">
    <svg class="icon" viewBox="0 0 64 64" role="img" aria-label="方案 C">
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#EEF0FE"/>
      <path d="M20 22h24v20H20z" fill="#5B6BE8"/>
      <path d="M20 22h24M20 32h24M32 22v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M42 18l7 7-7 7" fill="none" stroke="#35A9D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2>C · Release Grid</h2>
    <p>项目网格 + 发布箭头，偏产品发布管理。</p>
  </section>
</div>
</body>
</html>
